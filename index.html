<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crônicas RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
:root{
  --blood:#8B0000;--blood2:#b22222;
  --ink:#0d0905;--surf:#161008;--card:#1e1510;--cardh:#261a12;
  --br:#3a2a1a;--br2:#5a3a20;
  --gd:#c9a84c;--gd2:#7a6030;
  --tx:#e8d9c0;--tx2:#8a7a65;--tx3:#5a4a35;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);font-family:'Crimson Text',serif;color:var(--tx);min-height:100vh;}

#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;}
.login-title{font-family:'Cinzel',serif;font-size:28px;color:var(--gd);letter-spacing:3px;}
.google-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#333;border:none;border-radius:4px;padding:12px 24px;font-size:15px;cursor:pointer;}
.google-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.3);}

#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--surf);border-bottom:2px solid var(--blood);padding:10px 20px;display:flex;align-items:center;gap:12px;}
.topbar-name{font-family:'Cinzel',serif;font-size:14px;color:var(--gd);flex:1;letter-spacing:1px;}
.sair-btn{background:none;border:1px solid var(--br2);color:var(--tx3);font-size:11px;padding:4px 10px;cursor:pointer;border-radius:2px;font-family:'Cinzel',serif;}
.sair-btn:hover{border-color:var(--blood);color:#f88;}

.conteudo{padding:24px;max-width:800px;margin:0 auto;}

.criar-bar{display:flex;gap:10px;margin-bottom:20px;}
.criar-input{flex:1;background:var(--card);border:1px solid var(--br2);border-radius:2px;padding:10px 14px;color:var(--tx);font-family:'Crimson Text',serif;font-size:15px;outline:none;}
.criar-input:focus{border-color:var(--blood);}
.criar-btn{background:var(--blood);border:none;color:#fff;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;padding:10px 20px;cursor:pointer;border-radius:2px;}
.criar-btn:hover{background:var(--blood2);}
.criar-btn:disabled{opacity:.5;cursor:not-allowed;}

.erro{color:#f88;font-size:13px;margin-bottom:12px;padding:8px 12px;background:rgba(139,0,0,.15);border:1px solid rgba(139,0,0,.4);border-radius:2px;}

.cronicas-lista{display:flex;flex-direction:column;gap:10px;}
.cronica-card{background:var(--surf);border:1px solid var(--br);border-radius:2px;overflow:hidden;}
.cronica-head{display:flex;align-items:center;padding:12px 16px;background:var(--card);cursor:pointer;gap:10px;user-select:none;}
.cronica-head:hover{background:var(--cardh);}
.cronica-nome{font-family:'Cinzel',serif;font-size:15px;color:var(--gd);flex:1;letter-spacing:1px;}
.cronica-count{font-size:12px;color:var(--tx3);font-style:italic;}
.cronica-body{display:none;padding:14px 16px;border-top:1px solid var(--br);}
.cronica-body.aberta{display:block;}

.add-row{display:flex;gap:8px;margin-bottom:12px;}
.url-input{flex:1;background:var(--card);border:1px solid var(--br2);border-radius:2px;padding:8px 12px;color:var(--tx);font-family:'Crimson Text',serif;font-size:13px;outline:none;}
.url-input:focus{border-color:var(--gd2);}
.add-btn{background:rgba(201,168,76,.15);border:1px solid var(--gd2);color:var(--gd);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;padding:8px 14px;cursor:pointer;border-radius:2px;white-space:nowrap;}
.add-btn:hover{background:rgba(201,168,76,.3);}

.ficha-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:2px;padding:8px 12px;margin-bottom:6px;}
.ficha-item:last-child{margin-bottom:0;}
.ficha-nome{flex:1;font-size:14px;color:var(--tx);}
.ficha-url{font-size:11px;color:var(--tx3);font-style:italic;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rm-btn{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;}
.rm-btn:hover{color:#f66;}
.vazio{font-size:13px;color:var(--tx3);font-style:italic;text-align:center;padding:10px 0;}
</style>
</head>
<body>

<div id="login">
  <div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:var(--blood2);text-transform:uppercase;">Mestre de Jogo</div>
  <div class="login-title">Crônicas RPG</div>
  <button class="google-btn" onclick="entrar()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar com Google
  </button>
</div>

<div id="app">
  <div class="topbar">
    <span class="topbar-name" id="nomeUsuario"></span>
    <button class="sair-btn" onclick="sair()">Sair</button>
  </div>
  <div class="conteudo">
    <div class="criar-bar">
      <input class="criar-input" id="nomeInput" placeholder="Nome da nova crônica..." onkeydown="if(event.key==='Enter')criarCronica()"/>
      <button class="criar-btn" id="criarBtn" onclick="criarCronica()">+ Criar Crônica</button>
    </div>
    <div id="erroDiv" style="display:none;" class="erro"></div>
    <div class="cronicas-lista" id="lista"><div class="vazio">Carregando...</div></div>
  </div>
</div>

<script>
const SB = supabase.createClient(
  'https://tdnuqgiggbsfnkbcpogd.supabase.co',
  'sb_publishable_r5yfC1q427B5af9kR3u6Xg_EqCiPMuL'
);

let USER = null;
let DADOS = []; // [{cronica, fichas:[]}]

// AUTH
async function entrar(){
  await SB.auth.signInWithOAuth({provider:'google', options:{redirectTo:window.location.href}});
}
async function sair(){
  await SB.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
}
SB.auth.onAuthStateChange(async(_,session)=>{
  if(session?.user){
    USER=session.user;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('nomeUsuario').textContent=USER.user_metadata?.full_name||USER.email;
    carregar();
  }
});

// ERRO
function erro(msg){
  const d=document.getElementById('erroDiv');
  d.textContent=msg; d.style.display='block';
  setTimeout(()=>d.style.display='none',6000);
}

// CARREGAR
async function carregar(){
  const {data:cronicas,error:e}=await SB.from('cronicas').select('*').eq('mestre_id',USER.id).order('criado_em',{ascending:false});
  if(e){erro('Erro ao carregar: '+e.message+' ('+e.code+')');renderizar([]);return;}
  DADOS=[];
  for(const c of cronicas||[]){
    const {data:fc}=await SB.from('ficha_cronica').select('*').eq('cronica_id',c.id);
    DADOS.push({cronica:c,fichas:fc||[]});
  }
  renderizar(DADOS);
}

// CRIAR CRONICA
async function criarCronica(){
  const nome=document.getElementById('nomeInput').value.trim();
  if(!nome) return;
  const btn=document.getElementById('criarBtn');
  btn.disabled=true; btn.textContent='...';
  const {data,error:e}=await SB.from('cronicas').insert({mestre_id:USER.id,nome}).select().single();
  btn.disabled=false; btn.textContent='+ Criar Crônica';
  if(e){erro('Erro: '+e.message+' | code: '+e.code);return;}
  document.getElementById('nomeInput').value='';
  DADOS.unshift({cronica:data,fichas:[]});
  renderizar(DADOS);
}

// ADICIONAR FICHA
async function adicionarFicha(cid){
  const inp=document.getElementById('inp_'+cid);
  const url=inp.value.trim();
  if(!url){alert('Cole o link da ficha');return;}
  const nome=url.split('/').filter(Boolean).pop()||url;
  const {data,error:e}=await SB.from('ficha_cronica').insert({
    cronica_id:cid, ficha_url:url, ficha_nome:nome,
    xp_disponivel:0, xp_gasto:0, status:'ativa'
  }).select().single();
  if(e){alert('Erro ao adicionar: '+e.message);return;}
  inp.value='';
  const item=DADOS.find(d=>d.cronica.id===cid);
  if(item) item.fichas.push(data);
  renderizar(DADOS);
  // reabre o card
  document.getElementById('body_'+cid).classList.add('aberta');
}

// REMOVER FICHA
async function removerFicha(fid,cid){
  if(!confirm('Remover esta ficha da crônica?')) return;
  await SB.from('ficha_cronica').delete().eq('id',fid);
  const item=DADOS.find(d=>d.cronica.id===cid);
  if(item) item.fichas=item.fichas.filter(f=>f.id!==fid);
  renderizar(DADOS);
  document.getElementById('body_'+cid).classList.add('aberta');
}

// TOGGLE
function toggle(cid){
  document.getElementById('body_'+cid).classList.toggle('aberta');
}

// RENDERIZAR
function renderizar(dados){
  const lista=document.getElementById('lista');
  if(!dados.length){lista.innerHTML='<div class="vazio">Nenhuma crônica. Crie uma acima.</div>';return;}
  lista.innerHTML='';
  dados.forEach(({cronica:c,fichas})=>{
    const div=document.createElement('div');
    div.className='cronica-card';
    const qtd=fichas.length;
    const fichasHtml=qtd===0
      ?'<div class="vazio">Nenhuma ficha adicionada ainda.</div>'
      :fichas.map(f=>`
        <div class="ficha-item">
          <div class="ficha-nome">${f.ficha_nome||'Jogador'}</div>
          <div class="ficha-url" title="${f.ficha_url||''}">${f.ficha_url||''}</div>
          <button class="rm-btn" onclick="removerFicha('${f.id}','${c.id}')">✕</button>
        </div>`).join('');
    div.innerHTML=`
      <div class="cronica-head" onclick="toggle('${c.id}')">
        <div class="cronica-nome">${c.nome}</div>
        <div class="cronica-count">${qtd} ficha${qtd!==1?'s':''}</div>
        <span style="color:var(--tx3);font-size:11px;">▶</span>
      </div>
      <div class="cronica-body" id="body_${c.id}">
        <div class="add-row">
          <input class="url-input" id="inp_${c.id}" placeholder="Cole aqui o link da ficha do jogador..." onkeydown="if(event.key==='Enter')adicionarFicha('${c.id}')"/>
          <button class="add-btn" onclick="adicionarFicha('${c.id}')">+ Adicionar Ficha</button>
        </div>
        ${fichasHtml}
      </div>`;
    lista.appendChild(div);
  });
}
</script>
</body>
</html>
