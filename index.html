<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha RPG - Login</title>
<script>
const SUPABASE_URL = 'https://psaoxyuwzglkhtohiiuo.supabase.co';
const SUPABASE_KEY = 'SUA_PUBLIC_KEY_AQUI';

const SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let USER = null;

function fichaUrl(id) {
  return 'ficha.html?id=' + encodeURIComponent(id);
}

function setStatus(t) {
  document.getElementById('status').textContent = t || '';
}

async function loginGoogle() {
  await SB.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://armanfm.github.io/ficha-rpg/'
    }
  });
}

async function logout() {
  await SB.auth.signOut();

  USER = null;

  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

SB.auth.onAuthStateChange(async (_event, session) => {

  if (session?.user) {

    USER = session.user;

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    document.getElementById('user').textContent =
      USER.user_metadata?.name ||
      USER.email ||
      'Usuario';

    document.getElementById('avatar').src =
      USER.user_metadata?.avatar_url || '';

    await refreshHome();

  } else {

    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';

  }

});

async function refreshHome() {

  if (!USER) return;

  const box = document.getElementById('mySheets');

  box.innerHTML = '<div class="loading">Carregando...</div>';

  const { data, error } = await SB
    .from('fichas')
    .select(`
      id,
      nome,
      status,
      xp_total,
      xp_gasto,
      atualizada_em,
      criada_em,
      jogador_id
    `)
    .order('atualizada_em', { ascending: false });

  if (error) {

    box.innerHTML =
      '<div class="empty">' + error.message + '</div>';

    return;
  }

  renderSheets(data || []);
}

function renderSheets(list) {

  const box = document.getElementById('mySheets');

  box.innerHTML = '';

  if (!list.length) {

    box.innerHTML =
      '<div class="empty">Nenhuma ficha ainda.</div>';

    return;
  }

  list.forEach(f => {

    const el = document.createElement('div');

    el.className = 'item';

    const xp =
      (f.xp_total || 0) -
      (f.xp_gasto || 0);

    el.innerHTML = `
      <div>
        <div class="name">
          ${f.nome || 'Sem nome'}
        </div>

        <div class="meta">
          ${f.status || 'rascunho'}
          -
          XP ${xp}
          -
          ${new Date(
            f.atualizada_em || f.criada_em
          ).toLocaleDateString('pt-BR')}
        </div>
      </div>

      <button class="btn btn-sec">
        Abrir
      </button>
    `;

    el.onclick = () => {
      location.href = fichaUrl(f.id);
    };

    box.appendChild(el);

  });

}

async function novaFicha() {

  setStatus('Criando ficha...');

  const { data, error } = await SB.rpc(
    'criar_ficha',
    {
      p_nome: 'Novo Personagem',
      p_dados: {}
    }
  );

  if (error) {

    setStatus(error.message);

    return;
  }

  location.href = fichaUrl(data.id);
}

async function usarTokenMestre() {

  const token =
    document.getElementById('tokenInput')
    .value
    .trim();

  if (!token) return;

  setStatus('Validando token...');

  const { data, error } = await SB.rpc(
    'aceitar_token_mestre',
    {
      p_token: token
    }
  );

  if (error) {

    setStatus(error.message);

    return;
  }

  location.href = fichaUrl(data.id);
}

async function usarTokenEdicao() {

  const token =
    document.getElementById('tokenInput')
    .value
    .trim();

  if (!token) return;

  setStatus('Reabrindo ficha...');

  const { data, error } = await SB.rpc(
    'reabrir_ficha_com_token',
    {
      p_token: token
    }
  );

  if (error) {

    setStatus(error.message);

    return;
  }

  location.href = fichaUrl(data.id);
}
</script>
</body>
</html>
